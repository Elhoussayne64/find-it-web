<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Find It — 3D Hidden Object Game | ElAr Games</title>
  <style>
    :root { --bg:#fdf2e2; --card:#ffffff; --ink:#3b2a2a; --soft:#7a6458; --accent:#f28b30; --ok:#2fa37a; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); line-height:1.6; padding:32px 16px; }
    .wrap { max-width:680px; margin:0 auto; background:var(--card); border-radius:24px; padding:36px 28px; box-shadow:0 12px 32px rgba(59,42,42,0.08); text-align:center; }
    h1 { font-size:2.2rem; margin-bottom:8px; color:var(--ink); }
    .tag { color:var(--soft); font-size:1.05rem; margin-bottom:24px; }
    .pill { display:inline-block; background:#f7e2c4; color:var(--ink); padding:6px 14px; border-radius:999px; font-weight:600; font-size:0.9rem; margin:4px; }
    .links { margin-top:28px; display:flex; flex-wrap:wrap; gap:12px; justify-content:center; }
    a.btn { text-decoration:none; padding:12px 22px; border-radius:14px; font-weight:700; transition:transform .15s; }
    a.btn:hover { transform:translateY(-1px); }
    a.primary { background:var(--accent); color:#fff; }
    a.secondary { background:#f3eadc; color:var(--ink); }
    footer { margin-top:28px; font-size:0.88rem; color:var(--soft); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Find It</h1>
    <p class="tag">3D Hidden Object House Exploration Game by ElAr Games</p>
    <div>
      <span class="pill">8 Connected 3D Rooms</span>
      <span class="pill">50 Handcrafted Levels</span>
      <span class="pill">9 Game Modes</span>
      <span class="pill">EN · AR · FR</span>
    </div>
    <div class="links">
      <a class="btn primary" href="./privacy-policy.html">Privacy Policy</a>
      <a class="btn secondary" href="mailto:support@elarmobo.com">Contact Support</a>
    </div>
    <footer>© 2026 ElAr Games · <code>com.elargames.findit</code></footer>
  </div>
</body>
</html>
